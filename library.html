<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="style.js"></script><script src="core.js"></script><script src="rig.js"></script><script src="library.js"></script>
<script>
const C=document.getElementById('c'), X=C.getContext('2d');
window.ready = Promise.all([document.fonts.load('700 22px Inter'), document.fonts.load('500 24px Inter')]);
// draw a named pose (or expression on the stand pose) centred on a plain card
window.drawPose=function(name,t,opts){
  const A=staticPose(name,opts||{}); const p=pose(A,t);
  X.setTransform(1,0,0,1,0,0); X.fillStyle=P.navy; X.fillRect(0,0,W,H);
  X.strokeStyle='rgba(237,230,214,0.25)'; X.lineWidth=3; X.beginPath(); X.moveTo(0,A.floor); X.lineTo(W,A.floor); X.stroke();
  if(name==='sit'){ X.fillStyle='#2A4A6A'; rr(X,A.standX-60,A.floor-118,230,26,8); X.fill(); rr(X,A.standX-70,A.floor-300,34,300,8); X.fill(); rr(X,A.standX-40,A.floor-96,20,96,4); X.fill(); rr(X,A.standX+150,A.floor-96,20,96,4); X.fill(); }
  if(name==='lie'){ X.fillStyle='#2A4A6A'; rr(X,A.standX-200,A.floor-70,620,70,14); X.fill(); }
  drawCharacter(X,t,p);
  X.font='700 40px Inter'; X.fillStyle=P.ivory; X.textAlign='left'; X.fillText(name,60,90);
};
window.drawFace=function(face,t,outfit){
  const A=staticPose('stand',{face:[[0,face]],outfit}); const p=pose(A,t);
  X.setTransform(1,0,0,1,0,0); X.fillStyle=P.navy; X.fillRect(0,0,W,H);
  X.save(); X.translate(W/2,H/2+100); X.scale(2.2,2.2); X.translate(-p.cx,-p.cy); drawCharacter(X,t,p); X.restore();
  X.font='700 40px Inter'; X.fillStyle=P.ivory; X.textAlign='left'; X.fillText(face,60,90);
};
</script></body></html>

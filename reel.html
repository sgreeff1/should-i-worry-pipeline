<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="vendor/d3-array.min.js"></script><script src="vendor/d3-geo.min.js"></script><script src="style.js"></script><script src="core.js"></script><script src="rig.js"></script><script src="library.js"></script><script src="icons.js"></script><script src="world.js"></script><script src="globe.js"></script><script src="meter.js"></script>
<script src="env/home.js"></script><script src="env/bedroom.js"></script><script src="env/clinic.js"></script><script src="env/void.js"></script><script src="env/body.js"></script>
<script src="camera.js"></script><script src="finish.js"></script><script src="anims/hook.js"></script><script src="templates.js"></script><script src="episode.js"></script>
<script>
const C=document.getElementById('c'), X=C.getContext('2d');
const OC=document.createElement('canvas'); OC.width=W; OC.height=H; const OX=OC.getContext('2d'); const OC2=document.createElement('canvas'); OC2.width=W; OC2.height=H;
const CC=document.createElement('canvas'); CC.width=W; CC.height=H; const CX=CC.getContext('2d');
const IMG={}; function loadImg(k,src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>{IMG[k]=i;r()}; i.src=src; }); }
// the reel is itself an episode: a sequence of template shots, 4 s each
const POSE_LIST=['stand','think','point','shrug','phone','wave','handsOnHips','sit','walk','backPain'];
const FACE_LIST=['calm','focus','worried','ouch','relief','surprise','thinking','talking','happy','tired'];
const shots=[]; let t=0; const add=(sh,d)=>{ sh.t0=t; sh.t1=t+d; shots.push(sh); t+=d; };
add({kind:'CHAPTER',title:'The system',kicker:'LIBRARY REEL · one rig, ten templates'},3);
add({kind:'CHAR',anim:'seq',env:'home',seq:[[0,'lookDown'],[1.0,'think',0.7],[2.6,'point',0.6],[4.2,'shrug',0.6],[5.8,'wave',0.5]],face:[[0,'calm'],[1,'thinking'],[2.6,'talking'],[4.2,'worried'],[5.8,'happy']],cut:true},7.5);
add({kind:'CHAR',anim:'seq',env:'clinic',outfit:'doctor',seq:[[0,'stand'],[0.8,'point',0.6],[3,'handsOnHips',0.6]],face:[[0,'calm'],[0.8,'talking']],cut:true},5);
add({kind:'CHAR',anim:'seq',env:'bedroom',seq:[[0,'lie']],face:[[0,'tired'],[2,'worried']],opts:{standX:BED.x+BED.w*0.62},cut:true},4);
add({kind:'CHAR',anim:'seq',env:'void',seq:[[0,'walk']],face:[[0,'calm']],cut:true},4);
add({kind:'COUNT',n:100,cols:20,highlight:[37,38],highlightAt:1.0},4);
add({kind:'COUNT',n:1000,cols:50,mode:'dots',highlight:[412,413,414],highlightAt:1.2},4);
add({kind:'CHART',type:'bar',labels:['20s','30s','40s','50s','60s','70s','80s'],values:[30,40,50,60,69,77,84],format:'{}%',title:'Pain-free people with a disc bulge, by age'},5);
add({kind:'ICONS',layout:'row',items:[{icon:'bladder',label:'Bladder'},{icon:'bowel',label:'Bowel'},{icon:'legs',label:'Legs'},{icon:'siren',label:'Go now'}]},4);
add({kind:'ICONS',layout:'single',size:300,items:[{icon:'toast',flip:1.5,flipTo:'flame'}]},4);
add({kind:'BANNER',tier:'GO NOW',sub:'emergency department',items:[{icon:'bladder',label:'Bladder'},{icon:'legs',label:'Weak legs'},{icon:'thermometer',label:'Fever',color:'#EB5757'}]},4);
add({kind:'BANNER',tier:'SAME DAY',items:[{icon:'thermometer',label:'Fever'},{icon:'document',label:'Past cancer'}]},3.5);
add({kind:'ANATOMY',asset:'spine',pointer:{at:[280,931],label:'Disc',t0:0.8}},4);
add({kind:'GLOBE'},3.5);
add({kind:'FIGURE',count:3,gap:420,pose:'stand',faces:['calm','worried','happy'],outfits:['default','alt','doctor'],overlays:[{region:'legs',color:'#EB5757',t0:1.0,fig:1,pulse:true}],icons:[{icon:'thermometer',at:'side',t0:1.6,fig:1,size:120,color:'#EB5757'}]},4);
add({kind:'END',title:'Should I Worry?',lines:['General education, not medical advice','Reviewed by Dr Greeff, neurosurgery registrar'],cta:'Subscribe for the next one'},3.5);
const REEL={title:'Library reel',tag:'PIPELINE — library reel · every pose, face, environment and template',shots,cards:[],cites:[],duration:t};
window.REEL_DURATION=t;
window.ready=(async()=>{ EP=REEL; await Promise.all([loadImg('spine','assets/A_Espace_epidural.png'),loadImg('body','assets/A_Colonne_normale2.png'),loadImg('vert','assets/A_vertebre_06.png'),loadImg('mask_disc','assets/mask_disc.png'),document.fonts.load('800 64px Inter'),document.fonts.load('500 26px Inter')]); return true; })();
window.draw=function(t){ drawEpisode(X,t,CX,CC,OC2); };
window.drawBlur=function(t,n,fps){ const shutter=0.5/fps; X.setTransform(1,0,0,1,0,0); X.clearRect(0,0,W,H); for(let i=0;i<n;i++){ const ti=t-shutter/2+shutter*(i+0.5)/n; drawEpisode(OX,Math.max(0,ti),CX,CC,OC2); X.globalAlpha=1/(i+1); X.drawImage(OC,0,0); } X.globalAlpha=1; };
</script></body></html>

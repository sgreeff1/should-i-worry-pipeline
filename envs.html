<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="style.js"></script><script src="core.js"></script><script src="rig.js"></script><script src="library.js"></script>
<script src="camera.js"></script><script src="finish.js"></script>
<script src="env/home.js"></script><script src="env/bedroom.js"></script><script src="env/clinic.js"></script><script src="env/hospital.js"></script><script src="env/street.js"></script><script src="env/workplace.js"></script><script src="env/void.js"></script><script src="env/body.js"></script><script src="icons.js"></script>
<script>
const C=document.getElementById('c'), X=C.getContext('2d');
const CC=document.createElement('canvas'); CC.width=W; CC.height=H; const CX=CC.getContext('2d');
const IMG={}; function loadImg(k,src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>{IMG[k]=i;r()}; i.src=src; }); }
window.ready = Promise.all([loadImg('spine','assets/A_Espace_epidural.png'), document.fonts.load('700 22px Inter')]);
const cam0={z:1.0,wx:W/2,wy:H/2,sx:W/2,sy:H/2,drift:0};
function chars(list){ CX.setTransform(1,0,0,1,0,0); CX.clearRect(0,0,W,H); for(const [A,t] of list){ drawCharacter(CX,t,pose(A,t)); } lightCharacter(CX); X.drawImage(CC,0,0); }
window.drawEnv=function(name,t){
  X.setTransform(1,0,0,1,0,0); X.fillStyle=P.navyD; X.fillRect(0,0,W,H);
  if(name==='home'){ const A=staticPose('lookDown'); homeSetup(A); drawHome(X,t,pose(A,t),cam0); chars([[A,t]]); }
  if(name==='bedroom'){ const A=staticPose('lie',{standX:BED.x+BED.w*0.62}); A.floor=H*0.84; drawBedroom(X,t,pose(A,t),cam0); chars([[A,t]]); }
  if(name==='clinic'){ const D=staticPose('point',{standX:W*0.36,outfit:'doctor',face:[[0,'talking']]}); const Pt=staticPose('sit',{standX:W*0.62,outfit:'alt',face:[[0,'worried']]});
    drawClinic(X,t,pose(D,t),cam0); X.fillStyle='#6E7F96'; rr(X,W*0.62-60,H*0.84-118,230,26,8); X.fill(); rr(X,W*0.62-70,H*0.84-300,34,300,8); X.fill(); chars([[Pt,t],[D,t]]); }
  if(name==='hospital'){ const D=staticPose('point',{standX:W*0.30,outfit:'doctor',face:[[0,'talking']]}); const Pt=staticPose('sit',{standX:W*0.63,outfit:'older',face:[[0,'worried']]}); Pt.floor=H*0.84-88;   // sitting on the trolley, feet dangling
    drawHospital(X,t,pose(D,t),cam0); chars([[Pt,t],[D,t]]); }
  if(name==='street'){ const A=staticPose('walk',{standX:W*0.42,outfit:'woman',face:[[0,'calm']]}); drawStreet(X,t,pose(A,t),cam0); chars([[A,t]]); }
  if(name==='workplace'){ const A=staticPose('sit',{standX:W*0.40,outfit:'lead',face:[[0,'tired']]}); drawWorkplace(X,t,pose(A,t),cam0); chars([[A,t]]); }
  if(name==='void'){ const A=staticPose('think',{face:[[0,'thinking']]}); drawVoid(X,t,pose(A,t),cam0); chars([[A,t]]); }
  if(name==='body'){ drawBodyStage(X,t,cam0); const im=IMG.spine, s=H*0.9/im.height; X.drawImage(im,W/2-im.width*s/2,H*0.05,im.width*s,im.height*s); }
  grade(X,t); vignette(X); X.font='700 40px Inter'; X.fillStyle=P.ivory; X.textAlign='left'; X.fillText(name,60,90);
};
</script></body></html>
